  <g transform="translate(50, 670)">
    <rect x="0" y="0" width="1000" height="175" rx="12" fill="#0f172a" stroke="#b45309" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="15" y="-11" width="340" height="22" rx="6" fill="#d97706" />
    <text x="25" y="4" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">LAYER 4 • POWER BI EXECUTIVE SUITE (8 DASHBOARDS)</text>

