    <g transform="translate(680, 25)">
      <rect x="0" y="0" width="295" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="18" y="28" fill="#34d399" font-size="14" font-weight="700">fn_MaskCustomerName</text>
      <text x="18" y="48" fill="#e2e8f0" font-size="12" font-weight="500">Bảo Mật Dữ Liệu Cá Nhân PII</text>
      <text x="18" y="68" fill="#94a3b8" font-size="11">Tuân thủ NDA &amp; Luật Ngân hàng</text>
      <rect x="210" y="14" width="70" height="18" rx="4" fill="#065f46" fill-opacity="0.4"/>
      <text x="219" y="27" fill="#34d399" font-size="10" font-weight="600">SECURITY</text>
    </g>
  </g>

  <!-- Connectors Layer 2 -> Layer 3 -->
  <path d="M 222 435 L 222 480" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowEmerald)"/>
  <path d="M 550 435 L 550 480" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowEmerald)"/>
  <path d="M 877 435 L 877 480" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowEmerald)"/>

