    <!-- Card 1 -->
    <g transform="translate(18, 22)">
      <rect x="0" y="0" width="230" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="24" fill="#fbbf24" font-size="13" font-weight="700">1. HĐKD Overview</text>
      <text x="12" y="42" fill="#e2e8f0" font-size="11" font-weight="500">Tăng trưởng &amp; Cơ cấu SP</text>
      <text x="12" y="55" fill="#94a3b8" font-size="9.5">Dư nợ, Huy động, APE, Thẻ</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(262, 22)">
      <rect x="0" y="0" width="230" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="24" fill="#fbbf24" font-size="13" font-weight="700">2. Daily CBNV Pacing</text>
      <text x="12" y="42" fill="#e2e8f0" font-size="11" font-weight="500">Nhịp độ &amp; Run-rate ngày</text>
      <text x="12" y="55" fill="#94a3b8" font-size="9.5">Tiến độ theo ngày làm việc</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(506, 22)">
      <rect x="0" y="0" width="230" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="24" fill="#fbbf24" font-size="13" font-weight="700">3. Phễu Tín Dụng</text>
      <text x="12" y="42" fill="#e2e8f0" font-size="11" font-weight="500">Quy trình vay &amp; TAT Days</text>
      <text x="12" y="55" fill="#94a3b8" font-size="9.5">Tỷ lệ chuyển đổi 5 tầng</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(750, 22)">
      <rect x="0" y="0" width="230" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="24" fill="#fbbf24" font-size="13" font-weight="700">4. KPI &amp; Incentive</text>
      <text x="12" y="42" fill="#e2e8f0" font-size="11" font-weight="500">Xếp hạng &amp; Tính thưởng</text>
      <text x="12" y="55" fill="#94a3b8" font-size="9.5">Bảng điểm 5 SP theo Chính Sách Chuẩn</text>
    </g>

    <!-- ===== ROW 2: 4 CUSTOMER PORTFOLIO DASHBOARDS 2025 ===== -->
    <!-- Card 5 -->
    <g transform="translate(18, 96)">
      <rect x="0" y="0" width="230" height="64" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.1"/>
      <text x="12" y="24" fill="#fde68a" font-size="13" font-weight="700">5. Danh Mục CASA</text>
      <text x="12" y="42" fill="#e2e8f0" font-size="11" font-weight="500">Số dư tiền gửi không kỳ hạn</text>
      <text x="12" y="55" fill="#94a3b8" font-size="9.5">Phân khúc Mass, Affluent, VIP</text>
    </g>

    <!-- Card 6 -->
    <g transform="translate(262, 96)">
      <rect x="0" y="0" width="230" height="64" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.1"/>
      <text x="12" y="24" fill="#fde68a" font-size="13" font-weight="700">6. Tiền Gửi FD</text>
      <text x="12" y="42" fill="#e2e8f0" font-size="11" font-weight="500">Tiết kiệm có kỳ hạn</text>
      <text x="12" y="55" fill="#94a3b8" font-size="9.5">Tái tục &amp; Cơ cấu kỳ hạn gửi</text>
    </g>

    <!-- Card 7 -->
    <g transform="translate(506, 96)">
      <rect x="0" y="0" width="230" height="64" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.1"/>
      <text x="12" y="24" fill="#fde68a" font-size="13" font-weight="700">7. Thẻ Tín Dụng (TTD)</text>
      <text x="12" y="42" fill="#e2e8f0" font-size="11" font-weight="500">Quản trị danh mục thẻ</text>
      <text x="12" y="55" fill="#94a3b8" font-size="9.5">Tỷ lệ kích hoạt &amp; Doanh số POS</text>
    </g>

    <!-- Card 8 -->
    <g transform="translate(750, 96)">
      <rect x="0" y="0" width="230" height="64" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.1"/>
      <text x="12" y="24" fill="#fde68a" font-size="13" font-weight="700">8. KH Reactive</text>
      <text x="12" y="42" fill="#e2e8f0" font-size="11" font-weight="500">Chiến dịch kích hoạt lại</text>
      <text x="12" y="55" fill="#94a3b8" font-size="9.5">Đánh thức khách hàng ngủ đông</text>
    </g>
  </g>
</svg>
