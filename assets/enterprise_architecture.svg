<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 885" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
  </pattern>
  <rect width="1100" height="885" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1060" height="845" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(50, 45)">
    <text x="0" y="24" fill="url(#headerGrad)" font-size="22" font-weight="800" letter-spacing="0.5">RETAIL BANKING MIS &amp; ANALYTICS PLATFORM</text>
    <text x="0" y="46" fill="#94a3b8" font-size="13" font-weight="400">Enterprise High-Level Data Architecture • End-to-End Analytics &amp; Performance System</text>
    <g transform="translate(850, 8)">
      <rect x="0" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#10b981" />
      <text x="26" y="18" fill="#e2e8f0" font-size="11" font-weight="600">PRODUCTION READY</text>
    </g>
  </g>

  <!-- ==================== LAYER 1: DATA SOURCES ==================== -->
  <g transform="translate(50, 115)">
    <rect x="0" y="0" width="1000" height="135" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="15" y="-11" width="260" height="22" rx="6" fill="#0369a1" />
    <text x="25" y="4" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">LAYER 1 • CORE BANKING &amp; DATA SOURCES</text>

    <!-- Source Card 1: Core T24 -->
    <g transform="translate(25, 25)">
      <rect x="0" y="0" width="295" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="18" y="28" fill="#38bdf8" font-size="15" font-weight="700">Core Banking (T24)</text>
      <text x="18" y="48" fill="#e2e8f0" font-size="12" font-weight="500">Tài Khoản CASA &amp; Tiền Gửi FD</text>
      <text x="18" y="68" fill="#94a3b8" font-size="11">Khách hàng cá nhân, số dư bình quân</text>
      <rect x="225" y="14" width="55" height="18" rx="4" fill="#0369a1" fill-opacity="0.4"/>
      <text x="235" y="27" fill="#38bdf8" font-size="10" font-weight="600">OLTP</text>
    </g>

    <!-- Source Card 2: Loan Origination -->
    <g transform="translate(352, 25)">
      <rect x="0" y="0" width="295" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="18" y="28" fill="#38bdf8" font-size="15" font-weight="700">Loan Origination (LOS)</text>
      <text x="18" y="48" fill="#e2e8f0" font-size="12" font-weight="500">Quy Trình Tín Dụng &amp; Phê Duyệt</text>
      <text x="18" y="68" fill="#94a3b8" font-size="11">Hồ sơ vay, TSĐB, giải ngân, TAT log</text>
      <rect x="215" y="14" width="65" height="18" rx="4" fill="#0369a1" fill-opacity="0.4"/>
      <text x="223" y="27" fill="#38bdf8" font-size="10" font-weight="600">WORKFLOW</text>
    </g>

    <!-- Source Card 3: Card & Switch -->
    <g transform="translate(680, 25)">
      <rect x="0" y="0" width="295" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="18" y="28" fill="#38bdf8" font-size="15" font-weight="700">Card &amp; Switch System</text>
      <text x="18" y="48" fill="#e2e8f0" font-size="12" font-weight="500">Thẻ Tín Dụng &amp; Giao Dịch POS</text>
      <text x="18" y="68" fill="#94a3b8" font-size="11">Thẻ phát hành, kích hoạt, hạn mức</text>
      <rect x="220" y="14" width="60" height="18" rx="4" fill="#0369a1" fill-opacity="0.4"/>
      <text x="228" y="27" fill="#38bdf8" font-size="10" font-weight="600">SWITCH</text>
    </g>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <path d="M 222 250 L 222 295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowBlue)"/>
  <path d="M 550 250 L 550 295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowBlue)"/>
  <path d="M 877 250 L 877 295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowBlue)"/>

