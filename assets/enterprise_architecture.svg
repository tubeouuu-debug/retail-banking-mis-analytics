    <g transform="translate(25, 25)">
      <rect x="0" y="0" width="295" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="18" y="28" fill="#34d399" font-size="14" font-weight="700">sp_Calculate_Sales_KPI</text>
      <text x="18" y="48" fill="#e2e8f0" font-size="12" font-weight="500">Incentive Engine Theo Chính Sách Chuẩn</text>
      <text x="18" y="68" fill="#94a3b8" font-size="11">Tính điểm lũy kế 5 SP, xếp hạng CBNV</text>
      <rect x="220" y="14" width="60" height="18" rx="4" fill="#065f46" fill-opacity="0.4"/>
      <text x="233" y="27" fill="#34d399" font-size="10" font-weight="600">T-SQL</text>
    </g>

    <!-- ETL Card 2: Dynamic RLS -->
    <g transform="translate(352, 25)">
      <rect x="0" y="0" width="295" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="18" y="28" fill="#34d399" font-size="14" font-weight="700">vw_Security_Branch_Hierarchy</text>
      <text x="18" y="48" fill="#e2e8f0" font-size="12" font-weight="500">Dynamic Row-Level Security 5 Cấp</text>
      <text x="18" y="68" fill="#94a3b8" font-size="11">Hội Sở → Vùng → Chi Nhánh → TBP → RM</text>
      <rect x="225" y="14" width="55" height="18" rx="4" fill="#065f46" fill-opacity="0.4"/>
      <text x="238" y="27" fill="#34d399" font-size="10" font-weight="600">RLS</text>
    </g>

