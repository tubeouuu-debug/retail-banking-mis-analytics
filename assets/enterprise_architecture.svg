  <g transform="translate(50, 485)">
    <rect x="0" y="0" width="1000" height="135" rx="12" fill="#0f172a" stroke="#581c87" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="15" y="-11" width="300" height="22" rx="6" fill="#7e22ce" />
    <text x="25" y="4" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">LAYER 3 • VERTIPAQ STAR SCHEMA DATA MODEL</text>

    <!-- Model Card 1: Fact Tables -->
    <g transform="translate(25, 25)">
      <rect x="0" y="0" width="460" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <text x="18" y="28" fill="#c084fc" font-size="15" font-weight="700">Fact Tables (Giao Dịch &amp; Chỉ Tiêu)</text>
      <text x="18" y="48" fill="#e2e8f0" font-size="12" font-weight="500">fact_kpi_actual_luy_ke • fact_kpi_targets_monthly</text>
      <text x="18" y="68" fill="#94a3b8" font-size="11">fact_credit_funnel_detail • fact_customer_portfolio_detail</text>
      <rect x="360" y="14" width="85" height="18" rx="4" fill="#581c87" fill-opacity="0.4"/>
      <text x="370" y="27" fill="#c084fc" font-size="10" font-weight="600">FACT 30K+ ROWS</text>
    </g>

    <!-- Model Card 2: Dimension Tables -->
    <g transform="translate(515, 25)">
      <rect x="0" y="0" width="460" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <text x="18" y="28" fill="#c084fc" font-size="15" font-weight="700">Dimension Tables (Phân Cấp &amp; Danh Mục)</text>
      <text x="18" y="48" fill="#e2e8f0" font-size="12" font-weight="500">dim_dvkd_branch (3 Vùng, 24 ĐVKD) • dim_employee_cbnv (298 RMs)</text>
      <text x="18" y="68" fill="#94a3b8" font-size="11">dim_calendar (Lịch làm việc ngân hàng &amp; Ngày tính Run-rate)</text>
      <rect x="385" y="14" width="60" height="18" rx="4" fill="#581c87" fill-opacity="0.4"/>
      <text x="395" y="27" fill="#c084fc" font-size="10" font-weight="600">STAR 1:N</text>
    </g>
  </g>

  <!-- Connectors Layer 3 -> Layer 4 -->
  <path d="M 255 620 L 255 665" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)"/>
  <path d="M 745 620 L 745 665" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)"/>

