  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="1000" height="135" rx="12" fill="#0f172a" stroke="#065f46" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="15" y="-11" width="310" height="22" rx="6" fill="#059669" />
    <text x="25" y="4" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">LAYER 2 • MIS BUSINESS LOGIC &amp; SQL SECURITY</text>

